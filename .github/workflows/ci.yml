name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: Format and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install ruff
        run: pipx install ruff==0.16.3

      - name: Check formatting
        run: ruff format --check .

      - name: Lint
        run: ruff check --output-format=github .

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install the formatter
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Check that every JSON file is formatted
        run: pnpm run format:check

      # The workflows are the one thing here nothing else checks, and a mistake
      # in them is only visible once a run has already gone wrong. The archive
      # is verified by digest before anything in it runs.
      - name: Check the workflows themselves
        run: |
          curl -fsSL -o actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz actionlint
          ./actionlint -color
          rm -f actionlint actionlint.tar.gz
        shell: bash
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"

      - name: Lint the shell scripts
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck --severity=style --shell=bash scripts/*.sh

  types:
    name: Types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install mypy
        run: pipx install mypy==1.14.1

      # Strict, with every optional error class the checker offers. The
      # configuration lives in pyproject.toml so this run and a local one are
      # the same run.
      - name: Check types
        run: mypy

  test:
    name: Tests on Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Install coverage
        run: python -m pip install --disable-pip-version-check coverage==7.6.10

      - name: Run every test file, under coverage
        run: |
          python -m coverage erase
          status=0
          while IFS= read -r file; do
            echo "::group::${file}"
            python -m coverage run -a "${file}" || status=1
            echo "::endgroup::"
          done < <(find snesgfx conformance -name '*.test.py' | sort)
          exit "${status}"
        shell: bash

      - name: Coverage must be total
        run: python -m coverage report

      # No document is redistributable, so none is here and this checks nothing
      # on a runner. It says so rather than reporting a pass: the value is that
      # somebody running it with the manual on disk gets a real answer, and that
      # a run without it cannot be mistaken for one.
      - name: Every quoted sentence, against the document it came from
        run: python -m conformance.quotes

  speed:
    name: Throughput
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: A tile must still decode faster than the floor
        run: python -m conformance.speed

  conformance:
    name: Exhaustive checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # These walk their input spaces from end to end rather than sampling them,
      # so there is no suite to fetch and nothing to pin. The formats are exact.
      - name: Settle every format
        run: python -m conformance.exhaustive

  reference:
    name: Against an independent reading of the figures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Read the pinned reference commit
        id: pin
        run: |
          commit=$(python -c "import json,pathlib;print(json.loads(pathlib.Path('conformance/pinned.json').read_text())['reference']['commit'])")
          echo "commit=${commit}" >> "${GITHUB_OUTPUT}"

      - name: Cache the reference sources
        id: cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/snes-graphics-reference
          key: reference-${{ steps.pin.outputs.commit }}

      - name: Build the driver around them
        run: python -m conformance.build

      # Every figure this package read, against somebody else's reading of the
      # same one. The exhaustive walk beside it proves this package agrees with
      # itself over the whole space, which a misreading does too.
      - name: Hold every figure to the reference
        run: python -m conformance.against_reference

  cartridges:
    name: The layout, held to real cartridges
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # Cartridge images belong to whoever made them and are not here, so this
      # run checks nothing on a runner and says so. Exit two means nothing was
      # checked, which is not the same as the layout having been confirmed.
      - name: Read whatever cartridges are on this machine
        run: |
          set +e
          python3 -m conformance.against_cartridges > said.txt
          status=$?
          set -e
          cat said.txt
          if [ "${status}" -eq 2 ]; then
            echo "::notice title=Nothing was checked::$(head -1 said.txt)"
            exit 0
          fi
          if [ "${status}" -eq 0 ]; then
            echo "::notice title=Held to cartridges::$(tail -1 said.txt)"
          fi
          exit "${status}"
        shell: bash
